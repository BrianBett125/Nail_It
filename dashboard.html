<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail It Dashboard</title>
    <!-- Link to CSS stylesheet -->
    <link rel="stylesheet" href="styles/dashboard.css">
    <!-- FontAwesome icons for various icons used in the page -->
    <script src="https://kit.fontawesome.com/739d7a3cd3.js" crossorigin="anonymous"></script>
    <!-- Favicons for different devices -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <!-- Firebase is loaded as an ES module from src/data.js, imported by dashboard.js -->
</head>
<body>
    <!-- Header section with navigation bar -->
    <header>
        <div class="nav-bar">
            <div class="logo">Nail <i class="fa-solid fa-exclamation"></i> It</div>
            <!-- Navigation links -->
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="about-us.html">About Us</a>
            </div>
            <!-- Search bar -->
            <div class="search-container">
                <input type="text" placeholder="Search...">
            </div>
        </div>
    </header>

    <!-- Main dashboard layout -->
    <div class="dashboard">
        <!-- Sidebar with list of sites -->
        <div class="sidebar">
            <h2>Sites Dashboard</h2>
            <button id="addSiteButton">Add Site</button>
            <p id="sitesStatus" class="status" role="status">Loading sites...</p>
            <ul id="siteList"></ul>
        </div>
        <!-- Main content section -->
        <div class="main-content">
            <div class="content-header">
                <h1>Materials</h1>
                <button id="addMaterialButton">Add Material</button>
            </div>
            <p id="materialsStatus" class="status status-main" role="status">Loading...</p>
            <table id="materialsTable" hidden>
                <thead>
                    <tr>
                        <th>Material Name</th>
                        <th>Quantity</th>
                        <th>Units</th>
                        <th>Last Updated</th>
                        <th>Update</th>
                        <th>Delete</th>
                    </tr>
                </thead>
                <tbody id="materialTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal forms for adding and updating sites and materials -->
    <!-- Add Site Form. createdAt is stamped by the app; the building type options are filled by dashboard.js from src/logic.js -->
    <div id="siteFormContainer" class="site-form-container">
        <form id="siteForm" class="site-form">
            <h2>Add New Site</h2>
            <label for="siteName">Name:</label>
            <input type="text" id="siteName" name="siteName" autocomplete="off" required>
            <label for="siteLocation">Location:</label>
            <input type="text" id="siteLocation" name="siteLocation" autocomplete="off" required>
            <label for="buildingType">Type of Building:</label>
            <select id="buildingType" name="buildingType" required></select>
            <button type="button" id="cancelButton">Cancel</button>
            <button type="submit" id="add-site-btn">Add Site</button>
        </form>
    </div>

    <!-- UPDATE FORM -->
    <div id="updateFormContainer" class="update-form-container">
        <form id="updateForm" class="update-form">
            <h2>Edit</h2>
            <label for="uMaterialName">Material Name:</label>
            <input type="text" id="uMaterialName" name="materialName" list="materialNames" autocomplete="off" required>
            <label for="uQuantity">Quantity:</label>
            <input type="number" id="uQuantity" name="quantity" min="0" step="any" inputmode="decimal" required>
            <label for="uUnits">Units:</label>
            <select id="uUnits" name="units" required></select>
            <label for="uLastUpdated">Date:</label>
            <input type="date" id="uLastUpdated" name="lastUpdated" required>
            <button type="button" id="updateCancelButton">Cancel</button>
            <button type="submit" id="update-material-btn">Update</button>
        </form>
    </div>

    <!-- NEW MATERIAL FORM. Add closes the form; Add & another keeps it open for the next item. -->
    <div id="materialFormContainer" class="material-form-container">
        <form id="materialForm" class="material-form">
            <h2>New Material</h2>
            <label for="materialsName">Material Name:</label>
            <input type="text" id="materialsName" name="materialName" list="materialNames" autocomplete="off" required>
            <label for="mQuantity">Quantity:</label>
            <input type="number" id="mQuantity" name="quantity" min="0" step="any" inputmode="decimal" required>
            <label for="mUnits">Units:</label>
            <select id="mUnits" name="units" required></select>
            <label for="mLastUpdated">Date:</label>
            <input type="date" id="mLastUpdated" name="lastUpdated" required>
            <button type="button" id="materialCancelButton">Cancel</button>
            <button type="submit" id="material-btn">Add</button>
            <button type="submit" id="material-another-btn">Add &amp; another</button>
        </form>
        <datalist id="materialNames"></datalist>
    </div>

    <!-- Delete site confirmation: the site name must be typed. Deleting a material has no
         dialog, it shows a "Deleted. Undo" toast instead. -->
    <div id="siteDeleteContainer" class="del-site-form-container">
        <form id="siteDeleteForm" class="delete-form">
            <h3>Delete this site and all its materials?</h3>
            <p>Type <strong id="siteDeletePhrase"></strong> to confirm.</p>
            <input type="text" id="siteDeleteInput" autocomplete="off" aria-label="Type the site name to confirm">
            <button type="button" id="siteDeleteCancel">Cancel</button>
            <button type="submit" id="siteDeleteConfirm" disabled>Delete site</button>
        </form>
    </div>

    <script src="dashboard.js" type="module"></script>
</body>
</html>
