<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nail It Overview</title>
    <!-- The header comes from the dashboard stylesheet, the page itself from overview.css -->
    <link rel="stylesheet" href="styles/dashboard.css">
    <link rel="stylesheet" href="styles/insights.css">
    <link rel="stylesheet" href="styles/overview.css">
    <script src="https://kit.fontawesome.com/739d7a3cd3.js" crossorigin="anonymous"></script>
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <!-- Firebase is loaded as an ES module from src/data.js, imported by overview.js -->
</head>
<body class="overview-page">
    <header>
        <div class="nav-bar">
            <div class="logo">Nail <i class="fa-solid fa-exclamation"></i> It</div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="overview.html" aria-current="page">Overview</a>
                <a href="about-us.html">About Us</a>
            </div>
            <div class="user-area">
                <span id="userEmail"></span>
                <button type="button" id="signOutButton">Sign out</button>
            </div>
        </div>
    </header>

    <main class="overview">
        <div class="overview-head">
            <h1>Overview</h1>
            <p id="overviewTotals" class="overview-totals"></p>
        </div>
        <p id="overviewStatus" class="overview-status" role="status">Loading sites...</p>
        <a id="overviewAddSite" class="overview-add" href="dashboard.html" hidden>Open the dashboard to add your first site</a>
        <ul id="overviewList" class="overview-list"></ul>
    </main>

    <script src="overview.js" type="module"></script>
</body>
</html>
