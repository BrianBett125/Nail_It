# Every pull request runs the same gates a human runs by hand: lint and formatting, the pure unit
# tests, the database rules on the Firebase emulator, and the browser suite in Chrome. The site has
# no build step, so there is nothing to compile here: the checks are the tests themselves.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push to the same branch makes the previous run's answer stale, so cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  rules:
    name: Database rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # firebase-tools runs the Realtime Database emulator as a Java program.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run test:rules

  e2e:
    name: End-to-end (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # GitHub's Ubuntu runners already carry Chrome; point the suite at whichever one is there.
      - name: Locate Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "Using Chrome at ${CHROME:-/usr/bin/google-chrome (default)}"
      - run: npm run test:e2e
